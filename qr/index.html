<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery & Design Calpe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Логотип */
        .logo {
            width: 90px;
            opacity: 0;
            filter: blur(10px);
            animation: logoFade 2s 0.2s forwards;
            margin-bottom: 20px;
        }

        @keyframes logoFade {
            to { opacity: 1; filter: blur(0); }
        }

        /* Анимация фразы */
        .phrase-container {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phrase {
            font-size: 13px;
            font-weight: 200;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: 100px; /* Раскиданы */
            opacity: 0;
            filter: blur(15px);
            animation: genesisGather 3s 0.8s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }

        @keyframes genesisGather {
            0% { opacity: 0; letter-spacing: 100px; filter: blur(15px); }
            100% { opacity: 0.7; letter-spacing: 6px; filter: blur(0); }
        }

        /* Кнопки */
        .buttons-container {
            margin-top: 35px;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            /* Появляются чуть раньше, на 3-й секунде */
            animation: fadeInButtons 1s 3s forwards;
        }

        .btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.8);
            padding: 12px 0;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 200px;
            display: block;
            box-sizing: border-box;
        }

        .btn:hover {
            border-color: white;
            color: white;
            background: rgba(255,255,255,0.1);
        }

        @keyframes fadeInButtons {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://raw.githubusercontent.com/gallerycalpe/site/main/assets/img/logos/logo6.png" alt="Gallery Calpe" class="logo">
        
        <div class="phrase-container">
            <div class="phrase">Concept & Materia</div>
        </div>

        <div class="buttons-container">
            <a href="https://gallerycalpe.art/assets/gallery-calpe.vcf" class="btn">Capture</a>
            <a href="https://gallerycalpe.art/" class="btn">Web Site</a>
            <a href="https://www.instagram.com/gallery_design_calpe/" class="btn">Instagram</a>
            <button onclick="luckyRedirect()" class="btn">Fortune</button>
        </div>
    </div>

    <script>
        function luckyRedirect() {
            const projects = [
                'https://gallerycalpe.art/#portfolio'
            ];
            const randomProject = projects[Math.floor(Math.random() * projects.length)];
            
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s';
            
            setTimeout(() => {
                window.location.href = randomProject;
            }, 500);
        }
    </script>
</body>
</html>
