<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery & Design Calpe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        .logo {
            width: 100px;
            opacity: 0;
            filter: blur(10px);
            animation: logoFade 3s 0.5s forwards;
            margin-bottom: 20px;
        }

        @keyframes logoFade {
            to { opacity: 1; filter: blur(0); }
        }

        .phrase-container {
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        .phrase {
            font-size: 14px;
            font-weight: 200;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: 120px;
            opacity: 0;
            filter: blur(20px);
            animation: genesisGather 4s 1s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }

        @keyframes genesisGather {
            0% { opacity: 0; letter-spacing: 120px; filter: blur(20px); transform: scale(1.1); }
            30% { opacity: 1; }
            100% { opacity: 0.8; letter-spacing: 8px; filter: blur(0); transform: scale(1); }
        }

        .buttons-container {
            margin-top: 40px;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            animation: fadeInButtons 1.5s 4.5s forwards;
        }

        .btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            padding: 12px 30px;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s;
            text-decoration: none;
            width: 200px;
            outline: none;
            box-sizing: border-box;
        }

        .btn:hover {
            border-color: white;
            color: white;
            background: rgba(255,255,255,0.05);
        }

        @keyframes fadeInButtons {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://raw.githubusercontent.com/gallerycalpe/site/main/assets/img/logos/logo6.png" alt="Gallery Calpe" class="logo">
        
        <div class="phrase-container">
            <div class="phrase">Concept & Materia</div>
        </div>

        <div class="buttons-container">
